name: Conflict-aware upstream sync
on:
  schedule:
    - cron: "15 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge upstream if there are no conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BEFORE="$(git rev-parse HEAD)"
          git fetch --no-tags https://github.com/BlackTechX011/Hacxgent.git HEAD
          if ! git merge --no-edit FETCH_HEAD; then
            git merge --abort || true
            echo "::warning::Upstream merge conflict; no changes pushed. Review upstream changes manually."
            exit 0
          fi
          if [ "$BEFORE" = "$(git rev-parse HEAD)" ]; then
            echo "Up to date"
            exit 0
          fi
          git push origin HEAD:"${{ github.event.repository.default_branch }}"
